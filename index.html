<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101112">
<title>VEGA | Engineering Workspace</title>

<style>
:root {
  --bg: #101112;
  --panel: #181a1c;
  --border: #303236;
  --red: #dc1d31;
  --text: #f4f4f5;
  --muted: #a1a5ad;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

button, input, select, textarea { font: inherit; }

button, a { -webkit-tap-highlight-color: transparent; }

button {
  cursor: pointer;
  color: inherit;
}

a {
  text-decoration: none;
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

.container {
  width: min(1400px, 90%);
  margin: auto;
}

/* Utility bar */

.utility {
  border-bottom: 1px solid var(--red);
  background: #141618;
  font-size: 12px;
  color: #c1c4c9;
}

.utility .container {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
}

.utility a:hover { color: white; }

/* Company header */

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 125px;
  gap: 30px;
}

.logo {
  display: inline-flex;
  flex-direction: column;
  line-height: 1;
}

.logo strong {
  font-size: 74px;
  font-style: italic;
  font-weight: 900;
  letter-spacing: -5px;
  color: #e5e6e8;
}

.logo small {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 4px;
}

.header-details {
  display: flex;
  gap: 28px;
}

.header-detail {
  display: flex;
  align-items: center;
  gap: 15px;
  padding-left: 25px;
  border-left: 1px solid #4b4e54;
  font-size: 11px;
  letter-spacing: 1.3px;
}

.header-detail svg {
  width: 31px;
  height: 31px;
  color: var(--red);
}

/* Navigation */

.navbar {
  position: relative;
  z-index: 30;
  background: #141618;
  border-block: 1px solid var(--border);
}

.nav-inner {
  display: flex;
  align-items: stretch;
}

.navigation {
  display: flex;
  flex: 1;
}

.nav-item {
  position: relative;
  flex: 1;
}

.nav-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 58px;
  padding: 14px 10px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  font-size: 11px;
  white-space: nowrap;
}

.nav-button:hover,
.nav-button.active,
.nav-item.open > .nav-button {
  background: #202226;
  border-bottom-color: var(--red);
}

.chevron {
  color: var(--red);
  font-size: 15px;
}

.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 250px;
  background: #191b1e;
  border: 1px solid #44474d;
  box-shadow: 0 18px 35px #0007;
}

.nav-item.open > .dropdown {
  display: block;
}

.dropdown a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 11px 18px;
  border-bottom: 1px solid #2d3035;
  font-size: 13px;
}

.dropdown a:last-child { border-bottom: 0; }

.dropdown a::after {
  content: "›";
  color: var(--red);
  font-size: 18px;
}

.dropdown a:hover { background: #292c31; }

.search-icon,
.mobile-menu {
  border: 0;
  background: transparent;
  padding: 12px 17px;
}

.search-icon svg {
  width: 22px;
  height: 22px;
}

.mobile-menu { display: none; }

/* Hero */

.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}

.hero-inner {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  min-height: 465px;
  gap: 30px;
  padding-block: 60px 40px;
}

.watermark {
  position: absolute;
  z-index: -1;
  top: -30px;
  left: 0;
  color: #ffffff0b;
  font-size: clamp(150px, 28vw, 440px);
  font-style: italic;
  font-weight: 900;
  letter-spacing: -.07em;
  line-height: 1.2;
  pointer-events: none;
}

.eyebrow {
  color: #d2d4d8;
  font-size: 11px;
  letter-spacing: 2.5px;
}

.eyebrow::after {
  content: "";
  display: block;
  width: 76px;
  height: 2px;
  margin: 16px 0 22px;
  background: var(--red);
}

.hero h1 {
  margin: 0 0 22px;
  font-size: clamp(34px, 3.6vw, 54px);
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -1.5px;
}

.hero p {
  max-width: 510px;
  margin-bottom: 30px;
  color: var(--muted);
  font-size: 16px;
}

.primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 23px;
  padding: 12px 18px;
  border: 1px solid var(--red);
  border-radius: 3px;
  background: var(--red);
  color: white;
  font-size: 13px;
}

.primary:hover { background: #b91427; }

.equipment {
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  align-self: end;
  filter: grayscale(1);
  mix-blend-mode: lighten;
  mask-image: linear-gradient(
    to right, transparent, black 8%, black 95%, transparent
  );
}

/* Workspace links */

.hub { padding-block: 25px 32px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 25px;
  margin: 0 0 24px;
  font-size: 19px;
  font-weight: 500;
}

.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.shortcuts {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin-bottom: 28px;
}

.shortcut {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 18px;
  border-right: 1px solid #45484f;
}

.shortcut:first-child { padding-left: 0; }

.shortcut:last-child { border-right: 0; }

.shortcut:hover { background: #ffffff04; }

.shortcut svg {
  flex-shrink: 0;
  width: 31px;
  height: 34px;
  color: var(--red);
}

.shortcut h3 {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.shortcut p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

/* Search */

.quick-search {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px;
  border: 1px solid #4c5057;
  border-radius: 3px;
}

.quick-search label {
  padding-inline: 12px;
  white-space: nowrap;
  font-size: 13px;
}

input, select, textarea {
  padding: 11px 13px;
  border: 1px solid #393d44;
  border-radius: 3px;
  background: #121416;
  color: white;
}

.quick-search select { max-width: 230px; }

.quick-search input {
  flex: 1;
  min-width: 0;
  border: 0;
}

.quick-search button { padding: 10px 19px; }

/* Department pages */

.page {
  min-height: 65vh;
  padding-block: 35px 65px;
}

.breadcrumb {
  margin-bottom: 26px;
  color: var(--muted);
  font-size: 12px;
}

.breadcrumb a { color: white; }

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 25px;
  border-bottom: 1px solid var(--border);
}

.page h1 {
  margin: 0 0 8px;
  font-size: 36px;
  font-weight: 500;
  line-height: 1.2;
}

.page-header p {
  margin: 0;
  color: var(--muted);
}

.filters {
  display: flex;
  gap: 12px;
  margin: 25px 0;
}

.filters input {
  flex: 1;
  min-width: 0;
}

.records {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.record {
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  overflow-wrap: anywhere;
}

.tag {
  display: inline-block;
  padding: 3px 9px;
  border: 1px solid #dc1d3140;
  background: #dc1d3112;
  color: #f48a95;
  font-size: 11px;
}

.record h2 {
  margin: 16px 0 10px;
  font-size: 19px;
  font-weight: 500;
}

.record p {
  color: var(--muted);
  font-size: 13px;
  white-space: pre-wrap;
}

.record a {
  display: inline-block;
  margin-top: 10px;
  border-bottom: 1px solid var(--red);
  font-size: 13px;
}

.empty {
  grid-column: 1 / -1;
  padding: 65px 20px;
  border: 1px dashed #454950;
  text-align: center;
  color: var(--muted);
}

.empty strong {
  display: block;
  margin-bottom: 10px;
  color: white;
  font-size: 21px;
  font-weight: 500;
}

.storage-note {
  margin-top: 25px;
  padding: 12px 16px;
  border-left: 2px solid var(--red);
  background: #ffffff03;
  color: var(--muted);
  font-size: 12px;
}

.backup-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

.secondary {
  display: inline-flex;
  align-items: center;
  padding: 10px 15px;
  border: 1px solid #444851;
  border-radius: 3px;
  background: transparent;
  color: white;
  cursor: pointer;
  font-size: 12px;
}

.secondary:hover { background: #24272c; }

.search-result {
  display: block;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

.search-result small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
}

.search-result:hover { color: #f76a7a; }

/* Add record window */

dialog {
  width: min(530px, 92vw);
  padding: 28px;
  border: 1px solid #4a4d54;
  border-radius: 5px;
  background: #191b1f;
  color: white;
}

dialog::backdrop { background: #000b; }

dialog h2 {
  margin-top: 0;
  font-size: 23px;
  font-weight: 500;
}

.form-fields {
  display: grid;
  gap: 15px;
}

.form-fields label { font-size: 13px; }

.form-fields input,
.form-fields select,
.form-fields textarea {
  display: block;
  width: 100%;
  margin-top: 5px;
}

.form-fields textarea {
  min-height: 85px;
  resize: vertical;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 22px;
}

.error {
  color: #ff8896;
  font-size: 13px;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding-block: 22px;
  border-top: 1px solid var(--border);
  color: #92969d;
  font-size: 10px;
  letter-spacing: 1.8px;
}

/* Responsive */

@media (hover: hover) and (min-width: 761px) {
  .nav-item:hover > .dropdown { display: block; }
}

@media (max-width: 1100px) {
  .header-details { gap: 15px; }
  .header-detail { padding-left: 15px; font-size: 9px; }
  .nav-button { font-size: 10px; padding-inline: 6px; }
  .shortcuts { grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .shortcut { padding: 8px 0; border: 0; }
  .records { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 760px) {
  .utility { font-size: 10px; }
  .utility .container > span:last-child { display: none; }
  .masthead { min-height: 105px; }
  .logo strong { font-size: 58px; }
  .logo small { font-size: 8px; letter-spacing: 3px; }
  .header-details { display: none; }

  .nav-inner {
    flex-wrap: wrap;
    justify-content: space-between;
  }

  .mobile-menu { display: block; padding-left: 0; }

  .navigation {
    display: none;
    order: 3;
    flex-basis: 100%;
    flex-direction: column;
  }

  .navbar.expanded .navigation { display: flex; }

  .nav-button {
    justify-content: space-between;
    min-height: 48px;
    font-size: 12px;
  }

  .dropdown {
    position: static;
    min-width: 0;
    box-shadow: none;
  }

  .hero-inner {
    grid-template-columns: 1fr;
    gap: 10px;
    min-height: auto;
    padding-top: 40px;
  }

  .watermark { top: 50px; font-size: 44vw; }
  .hero h1 { font-size: 38px; }
  .equipment { max-width: 540px; margin: auto; }
  .shortcuts { grid-template-columns: repeat(2, 1fr); }
  .shortcut { gap: 12px; }
  .shortcut h3 { font-size: 10px; }
  .shortcut p { font-size: 11px; }

  .quick-search { flex-wrap: wrap; }
  .quick-search label { display: none; }
  .quick-search select { width: 100%; max-width: none; }
  .quick-search input { width: 65%; }

  .page-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .page h1 { font-size: 30px; }
  .filters { flex-direction: column; }
  .records { grid-template-columns: 1fr; }
  footer { font-size: 8px; letter-spacing: 1px; }
}
</style>
</head>

<script>
"use strict";

/* -------------------------------------------------------
   Department configuration
------------------------------------------------------- */

const departments = [
  {
    id: "fuel",
    name: "Fuel System",
    icon: "fuel",
    description: "Fuel tanks, pumps, valves, sensors and accessories.",
    categories: [
      "All components",
      "Fuel Tanks",
      "Pumps",
      "Valves",
      "Sensors",
      "Control Panels",
      "Accessories"
    ]
  },
  {
    id: "datasheets",
    name: "Generator Datasheets",
    icon: "generator",
    description: "Technical datasheets organized by brand and model.",
    categories: [
      "All generator datasheets",
      "Cummins",
      "Perkins",
      "John Deere",
      "Kubota",
      "Volvo Penta",
      "Engines",
      "Alternators",
      "Controllers"
    ]
  },
  {
    id: "autocad",
    name: "AutoCAD Files",
    icon: "cad",
    description: "General arrangements, layouts and technical drawings.",
    categories: [
      "All drawings",
      "Generator GA",
      "Room Layouts",
      "Fuel System",
      "Tank Drawings",
      "ATS Panels"
    ]
  },
  {
    id: "projects",
    name: "Projects",
    icon: "projects",
    description: "Project records, references and related documentation.",
    categories: [
      "All projects",
      "Active",
      "Pending Approval",
      "Completed"
    ]
  },
  {
    id: "po",
    name: "Purchase Orders",
    icon: "po",
    description: "Purchase orders, suppliers and delivery follow-up.",
    categories: [
      "All orders",
      "Draft",
      "Issued",
      "In Production",
      "Ready",
      "Delivered"
    ]
  }
];

/*
  Add shared document records here.
  Place actual documents inside a "files" folder.

  Example:

  {
    id: "cummins-001",
    department: "datasheets",
    title: "Cummins generator datasheet",
    reference: "YOUR MODEL",
    category: "Cummins",
    notes: "Technical datasheet",
    link: "files/cummins-datasheet.pdf"
  }

  Valid department IDs:
  fuel, datasheets, autocad, projects, po
*/

const sharedRecords = [];

const STORAGE_KEY = "vega.workspace.records.v1";

let records = loadRecords();
let editingDepartment = null;
let refreshCurrentRecords = null;

const main = document.getElementById("main");
const dialog = document.getElementById("recordDialog");
const recordForm = document.getElementById("recordForm");

/* -------------------------------------------------------
   Helpers
------------------------------------------------------- */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function icon(name) {
  return `
    <svg
      viewBox="0 0 32 32"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <use href="#icon-${name}"></use>
    </svg>
  `;
}

function validRecord(record) {
  return record &&
    typeof record === "object" &&
    typeof record.title === "string" &&
    record.title.trim().length > 0 &&
    departments.some(department =>
      department.id === record.department
    );
}

function normalizeRecord(record) {
  return {
    id: String(record.id || makeID()),
    department: record.department,
    title: String(record.title).slice(0, 180),
    reference: String(record.reference || "").slice(0, 180),
    category: String(record.category || ""),
    notes: String(record.notes || "").slice(0, 4000),
    link: String(record.link || "")
  };
}

function loadRecords() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    if (!Array.isArray(saved)) return [];

    return saved.filter(validRecord).map(normalizeRecord);
  } catch {
    return [];
  }
}

function persistRecords(nextRecords) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(nextRecords));
  records = nextRecords;
}

function allRecords() {
  return [...sharedRecords.filter(validRecord), ...records];
}

function makeID() {
  if (globalThis.crypto?.randomUUID) {
    return crypto.randomUUID();
  }

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function safeDocumentURL(value) {
  if (!value || !String(value).trim()) return null;

  try {
    const parsed = new URL(String(value).trim(), location.href);

    if (!["http:", "https:", "file:"].includes(parsed.protocol)) {
      return null;
    }

    return parsed.href;
  } catch {
    return null;
  }
}

function departmentURL(id, category = "") {
  return "#" + id +
    (category ? "?category=" + encodeURIComponent(category) : "");
}

function closeMenus() {
  document.querySelectorAll(".nav-item.open").forEach(item => {
    item.classList.remove("open");
    item.querySelector("button")?.setAttribute(
      "aria-expanded", "false"
    );
  });
}

/* -------------------------------------------------------
   Navigation
------------------------------------------------------- */

function renderNavigation() {
  document.getElementById("navigation").innerHTML = `
    <div class="nav-item">
      <a href="#home" class="nav-button" data-home>HOME</a>
    </div>

    ${departments.map(department => `
      <div class="nav-item">
        <button
          class="nav-button"
          data-department="${department.id}"
          aria-expanded="false"
          aria-controls="menu-${department.id}"
        >
          ${department.name.toUpperCase()}
          <span class="chevron">⌄</span>
        </button>

        <div class="dropdown" id="menu-${department.id}">
          ${department.categories.map((category, index) => `
            <a href="${departmentURL(
              department.id,
              index === 0 ? "" : category
            )}">
              ${escapeHTML(category)}
            </a>
          `).join("")}
        </div>
      </div>
    `).join("")}
  `;

  document.querySelectorAll("[data-department]").forEach(button => {
    button.addEventListener("click", () => {
      const item = button.parentElement;
      const shouldOpen = !item.classList.contains("open");

      closeMenus();

      if (shouldOpen) {
        item.classList.add("open");
        button.setAttribute("aria-expanded", "true");
      }
    });
  });
}

/* -------------------------------------------------------
   Records
------------------------------------------------------- */

function renderRecordCards(list) {
  if (!list.length) {
    return `
      <div class="empty">
        <strong>No records yet</strong>
        Add a record with its reference, category and document link.
      </div>
    `;
  }

  return list.map(record => {
    const link = safeDocumentURL(record.link);

    return `
      <article class="record">
        <span class="tag">
          ${escapeHTML(record.category || "Record")}
        </span>

        <h2>${escapeHTML(record.title)}</h2>

        ${record.reference ? `
          <p>${escapeHTML(record.reference)}</p>
        ` : ""}

        ${record.notes ? `
          <p>${escapeHTML(record.notes)}</p>
        ` : ""}

        ${link ? `
          <a
            href="${escapeHTML(link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open document ↗
          </a>
        ` : ""}
      </article>
    `;
  }).join("");
}

function renderDepartment(department, parameters) {
  const selectedCategory = parameters.get("category") || "";

  main.innerHTML = `
    <section class="page container">
      <div class="breadcrumb">
        <a href="#home">Home</a> / ${department.name}
      </div>

      <div class="page-header">
        <div>
          <h1>${department.name}</h1>
          <p>${department.description}</p>
        </div>

        <button class="primary" id="addRecord">
          + Add record
        </button>
      </div>

      <div class="filters">
        <input
          id="recordSearch"
          aria-label="Search records"
          placeholder="Search ${department.name.toLowerCase()}…"
        >

        <select id="categoryFilter" aria-label="Filter by category">
          <option value="">
            ${department.categories[0]}
          </option>

          ${department.categories.slice(1).map(category => `
            <option
              value="${escapeHTML(category)}"
              ${category === selectedCategory ? "selected" : ""}
            >
              ${escapeHTML(category)}
            </option>
          `).join("")}
        </select>
      </div>

      <div class="records" id="recordList"></div>

      <div class="storage-note">
        Added records are saved in this browser only.
        Export a backup to keep a separate copy.
      </div>

      <div class="backup-actions">
        <button class="secondary" id="exportBackup">
          Export backup ↓
        </button>

        <label class="secondary">
          Import backup ↑
          <input
            id="importBackup"
            type="file"
            accept=".json,application/json"
            hidden
          >
        </label>
      </div>

      <p id="backupMessage" role="status"></p>
    </section>
  `;

  const search = document.getElementById("recordSearch");
  const category = document.getElementById("categoryFilter");

  function updateRecords() {
    const query = search.value.trim().toLowerCase();

    const filtered = allRecords().filter(record => {
      const correctDepartment =
        record.department === department.id;

      const correctCategory =
        !category.value || record.category === category.value;

      const matchesSearch = [
        record.title,
        record.reference,
        record.category,
        record.notes
      ].join(" ").toLowerCase().includes(query);

      return correctDepartment &&
        correctCategory &&
        matchesSearch;
    });

    document.getElementById("recordList").innerHTML =
      renderRecordCards(filtered);
  }

  refreshCurrentRecords = updateRecords;
  updateRecords();

  search.addEventListener("input", updateRecords);
  category.addEventListener("change", updateRecords);

  document.getElementById("addRecord").onclick = () => {
    openRecordDialog(department);
  };

  document.getElementById("exportBackup").onclick = exportBackup;

  document.getElementById("importBackup").addEventListener(
    "change",
    importBackup
  );
}

/* -------------------------------------------------------
   Add record
------------------------------------------------------- */

function openRecordDialog(department) {
  editingDepartment = department;
  recordForm.reset();

  document.getElementById("dialogTitle").textContent =
    "Add " + department.name + " record";

  document.getElementById("formError").textContent = "";

  document.getElementById("recordCategory").innerHTML =
    department.categories.slice(1).map(category => `
      <option value="${escapeHTML(category)}">
        ${escapeHTML(category)}
      </option>
    `).join("");

  dialog.showModal();
}

document.getElementById("cancelRecord").onclick = () => {
  dialog.close();
};

recordForm.addEventListener("submit", event => {
  event.preventDefault();

  if (!editingDepartment) return;

  const values = Object.fromEntries(new FormData(recordForm));
  values.title = values.title.trim();
  values.link = values.link.trim();

  if (!values.title) {
    document.getElementById("formError").textContent =
      "Please enter a title.";
    return;
  }

  if (values.link && !safeDocumentURL(values.link)) {
    document.getElementById("formError").textContent =
      "Enter an HTTP/HTTPS link or a relative document path.";
    return;
  }

  const newRecord = normalizeRecord({
    ...values,
    id: makeID(),
    department: editingDepartment.id
  });

  try {
    persistRecords([...records, newRecord]);
    dialog.close();
    refreshCurrentRecords?.();
  } catch {
    document.getElementById("formError").textContent =
      "Could not save. Browser storage is unavailable or full.";
  }
});

/* -------------------------------------------------------
   Backup
------------------------------------------------------- */

function exportBackup() {
  const blob = new Blob(
    [JSON.stringify(records, null, 2)],
    { type: "application/json" }
  );

  const downloadURL = URL.createObjectURL(blob);
  const anchor = document.createElement("a");

  anchor.href = downloadURL;
  anchor.download = "VEGA-workspace-backup.json";

  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();

  setTimeout(() => URL.revokeObjectURL(downloadURL), 1000);
}

async function importBackup(event) {
  const file = event.target.files?.[0];
  const message = document.getElementById("backupMessage");

  if (!file) return;

  try {
    const imported = JSON.parse(await file.text());

    if (!Array.isArray(imported) || !imported.every(validRecord)) {
      throw new Error("Invalid backup");
    }

    const normalized = imported.map(normalizeRecord);

    if (!window.confirm(
      "Replace the records saved in this browser with this backup?"
    )) {
      return;
    }

    persistRecords(normalized);
    refreshCurrentRecords?.();

    message.textContent = "Backup imported successfully.";
  } catch {
    message.textContent =
      "Could not import. Select a valid VEGA backup JSON file.";
  } finally {
    event.target.value = "";
  }
}

/* -------------------------------------------------------
   Global search
------------------------------------------------------- */

function renderSearch(parameters) {
  const query = (parameters.get("q") || "").trim();
  const departmentID = parameters.get("department") || "";
  const lowerQuery = query.toLowerCase();

  const matchedDepartments = departments.filter(department => {
    return (!departmentID || department.id === departmentID) &&
      [department.name, ...department.categories]
        .join(" ")
        .toLowerCase()
        .includes(lowerQuery);
  });

  const matchedRecords = allRecords().filter(record => {
    return (!departmentID || record.department === departmentID) &&
      [
        record.title,
        record.reference,
        record.category,
        record.notes
      ].join(" ").toLowerCase().includes(lowerQuery);
  });

  main.innerHTML = `
    <section class="page container">
      <div class="breadcrumb">
        <a href="#home">Home</a> / Search
      </div>

      <h1>Search results</h1>

      <p style="color:var(--muted)">
        Results for “${escapeHTML(query)}”
      </p>

      ${matchedDepartments.map(department => `
        <a class="search-result" href="#${department.id}">
          ${department.name} →
          <small>${department.description}</small>
        </a>
      `).join("")}

      <div class="records" style="margin-top:25px">
        ${renderRecordCards(matchedRecords)}
      </div>
    </section>
  `;
}

/* -------------------------------------------------------
   Page routing
------------------------------------------------------- */

function renderRoute() {
  if (dialog.open) dialog.close();

  refreshCurrentRecords = null;
  closeMenus();

  document.querySelector(".navbar").classList.remove("expanded");

  document.querySelector(".mobile-menu").setAttribute(
    "aria-expanded", "false"
  );

  const hash = location.hash.slice(1) || "home";
  const separatorIndex = hash.indexOf("?");

  const route = separatorIndex === -1
    ? hash
    : hash.slice(0, separatorIndex);

  const query = separatorIndex === -1
    ? ""
    : hash.slice(separatorIndex + 1);

  const parameters = new URLSearchParams(query);

  document.querySelectorAll(".nav-button").forEach(button => {
    const isActive = button.dataset.department === route ||
      (route === "home" && button.hasAttribute("data-home"));

    button.classList.toggle("active", isActive);
  });

  if (route === "home") {
    renderHome();
  } else if (route === "search") {
    renderSearch(parameters);
  } else {
    const department = departments.find(item => item.id === route);

    if (department) {
      renderDepartment(department, parameters);
    } else {
      main.innerHTML = `
        <section class="page container">
          <h1>Page not found</h1>
          <a class="primary" href="#home">Return home</a>
        </section>
      `;
    }
  }

  window.scrollTo(0, 0);
}

/* -------------------------------------------------------
   Global events
------------------------------------------------------- */

document.querySelector(".mobile-menu").onclick = () => {
  const navbar = document.querySelector(".navbar");
  const expanded = navbar.classList.toggle("expanded");

  document.querySelector(".mobile-menu").setAttribute(
    "aria-expanded",
    String(expanded)
  );
};

function focusGlobalSearch() {
  if (location.hash !== "#home") {
    location.hash = "home";
  }

  setTimeout(() => {
    document.getElementById("globalQuery")?.focus();
  }, 50);
}

document.getElementById("searchButton").onclick =
  focusGlobalSearch;

document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "k") {
    event.preventDefault();
    focusGlobalSearch();
  }

  if (event.key === "Escape") closeMenus();
});

document.addEventListener("click", event => {
  if (!event.target.closest(".nav-item")) closeMenus();
});

window.addEventListener("hashchange", renderRoute);

renderNavigation();
renderRoute();
</script>
